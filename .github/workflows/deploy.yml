name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt-in to Node.js 24 now

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4 supports Node 20/24 (latest)

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # v4 supports Node 20/24 (latest)
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4 # v4 supports Node 20/24 (latest)
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # v3 supports Node 20/24 (latest)
        with:
          path: dist